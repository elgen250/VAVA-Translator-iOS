name: Build VAVA Translator IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build & Archive Project
        run: |
          xcodebuild archive \
            -project VAVATranslator.xcodeproj \
            -scheme VAVATranslator \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/VAVATranslator.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Application into IPA
        run: |
          mkdir -p Payload
          # Copy the compiled .app bundle into Payload directory
          APP_PATH=$(find build/VAVATranslator.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled .app bundle!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          
          # Compress Payload folder into standard iOS .ipa package
          zip -r -q VAVATranslator-MVP.ipa Payload
          echo "Successfully packaged VAVATranslator-MVP.ipa"
          ls -lh VAVATranslator-MVP.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAVATranslator-MVP-ipa
          path: VAVATranslator-MVP.ipa
          retention-days: 14

      - name: Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VAVATranslator-MVP.ipa
          draft: false
          prerelease: false
          name: "VAVA Translator ${{ github.ref_name }}"
          generate_release_notes: true
