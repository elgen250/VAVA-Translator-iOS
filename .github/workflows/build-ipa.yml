name: Build VAVA Translator IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_DIR=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_DIR" ]; then
            echo "Selecting Xcode from $XCODE_DIR"
            sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          else
            echo "Defaulting to active Xcode"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Project
        run: |
          xcodebuild clean build \
            -project VAVATranslator.xcodeproj \
            -scheme VAVATranslator \
            -destination "generic/platform=iOS" \
            -UseModernBuildSystem=YES \
            -continueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive Project
        run: |
          xcodebuild archive \
            -project VAVATranslator.xcodeproj \
            -scheme VAVATranslator \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/VAVATranslator.xcarchive" \
            -UseModernBuildSystem=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Final Production IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/VAVATranslator.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled .app bundle!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          # Package the single final production IPA
          zip -r -q VAVATranslator.ipa Payload

          echo "Successfully packaged VAVATranslator Final Production IPA:"
          ls -lh VAVATranslator.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAVATranslator-Production-ipa
          path: VAVATranslator.ipa
          retention-days: 14

      - name: Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            VAVATranslator.ipa
          draft: false
          prerelease: false
          name: "VAVA Translator ${{ github.ref_name }} (Final Production)"
          generate_release_notes: true
