name: Build VAVA Translator IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_DIR=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_DIR" ]; then
            echo "Selecting Xcode from $XCODE_DIR"
            sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          else
            echo "Defaulting to active Xcode"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Project
        run: |
          xcodebuild clean build \
            -project VAVATranslator.xcodeproj \
            -scheme VAVATranslator \
            -destination "generic/platform=iOS" \
            -UseModernBuildSystem=YES \
            -continueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive Project
        run: |
          xcodebuild archive \
            -project VAVATranslator.xcodeproj \
            -scheme VAVATranslator \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/VAVATranslator.xcarchive" \
            -UseModernBuildSystem=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Application into IPA
        run: |
          APP_PATH=$(find build/VAVATranslator.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled .app bundle!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"

          # 1. Package Full Release (with embedded Keyboard & Widget PlugIns)
          mkdir -p package_full/Payload
          cp -R "$APP_PATH" package_full/Payload/
          (cd package_full && zip -r -q ../VAVATranslator-Full-Release.ipa Payload)
          rm -rf package_full

          # 2. Package Sideload-Ready (PlugIns stripped for Sideloadly / AltStore / Free Apple IDs)
          mkdir -p package_sideload/Payload
          cp -R "$APP_PATH" package_sideload/Payload/
          APP_NAME=$(basename "$APP_PATH")
          if [ -d "package_sideload/Payload/$APP_NAME/PlugIns" ]; then
            echo "Removing embedded PlugIns for clean Sideloadly compatibility..."
            rm -rf "package_sideload/Payload/$APP_NAME/PlugIns"
          fi
          (cd package_sideload && zip -r -q ../VAVATranslator-Sideload.ipa Payload)
          rm -rf package_sideload

          # 3. Create alias VAVATranslator-MVP.ipa pointing to Sideload-Ready package
          cp VAVATranslator-Sideload.ipa VAVATranslator-MVP.ipa

          echo "Successfully packaged VAVATranslator IPAs:"
          ls -lh VAVATranslator-*.ipa

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VAVATranslator-Release-ipa
          path: VAVATranslator-*.ipa
          retention-days: 14

      - name: Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            VAVATranslator-Sideload.ipa
            VAVATranslator-Full-Release.ipa
            VAVATranslator-MVP.ipa
          draft: false
          prerelease: false
          name: "VAVA Translator ${{ github.ref_name }}"
          generate_release_notes: true
